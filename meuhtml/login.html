<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 1% Melhor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">

    <header class="main-header">
        <div class="logo-area">
            <a href="index.html" style="text-decoration:none; color:inherit;"><span class="logo-text">1% Melhor</span></a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h2>Bem-vindo de volta</h2>
            <p>Acesse sua conta para continuar evoluindo.</p>

            <form action="index.html" method="GET" class="login-form">
                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <div class="login-footer">
                <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
            </div>
        </div>
    </main>

</body>
</html>
