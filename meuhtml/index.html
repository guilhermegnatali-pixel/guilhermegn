<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1% MELHOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="announcement-bar">
        SEJA 1% MELHOR A CADA AÚDIO
    </div>

    <header class="main-header">
        <div class="logo-area">
            <span class="logo-text">1% Melhor</span>
        </div>
        
        <div class="search-container">
            <input type="text" placeholder="Buscar audiobooks..." class="search-input">
        </div>

        <div class="header-icons">
            <span class="icon">♡</span>
        </div>
    </header>

    <main class="content-wrapper">
        <section class="section-title">
            <h1>Mais Ouvidos</h1>
            <p>Os audiobooks mais poderosos da semana</p>
        </section>

        <section class="book-grid">
            
            <article class="book-card">
                <div class="book-image-wrapper">
                    <img src="https://m.media-amazon.com/images/I/819ERrDHRcL.jpg" alt="Mais Esperto que o Diabo">
                    <button class="wishlist-btn"><i class="far fa-heart"></i></button>
                </div>
                <div class="book-info">
                    <div class="book-rating">
                        <i class="fas fa-star rating-star"></i>
                        <span class="rating-number">4.9</span>
                    </div>
                    <h2 class="book-title">Mais Esperto que o Diabo</h2>
                    <p class="book-author">Napoleon Hill</p>
                </div>
            </article>

            <article class="book-card">
                <div class="book-image-wrapper">
                    <img src="https://m.media-amazon.com/images/I/71pn8H1Ev4L.jpg" alt="48 Leis do Poder">
                    <button class="wishlist-btn"><i class="far fa-heart"></i></button>
                </div>
                <div class="book-info">
                    <div class="book-rating">
                        <i class="fas fa-star rating-star"></i>
                        <span class="rating-number">4.8</span>
                    </div>
                    <h2 class="book-title">48 Leis do Poder</h2>
                    <p class="book-author">Robert Greene</p>
                </div>
            </article>

            <article class="book-card">
                <div class="book-image-wrapper">
                    <img src="https://m.media-amazon.com/images/I/81-D3KPrfSL._AC_UF1000,1000_QL80_.jpg" alt="Hábitos Atômicos">
                    <button class="wishlist-btn"><i class="far fa-heart"></i></button>
                </div>
                <div class="book-info">
                    <div class="book-rating">
                        <i class="fas fa-star rating-star"></i>
                        <span class="rating-number">4.9</span>
                    </div>
                    <h2 class="book-title">Hábitos Atômicos</h2>
                    <p class="book-author">James Clear</p>
                </div>
            </article>

        </section>
    </main>

    <div class="chat-button">
        <span>Talk with Us</span>
    </div>

</body>
</html>
